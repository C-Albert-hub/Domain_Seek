[package]
name = "reverse_dns_tool"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.36", features = ["full"] }
csv = "1.2"
rust_xlsxwriter = "0.50"
colored = "2.0"
clap = { version = "4.4", features = ["derive"] }
futures = "0.3"
reqwest = { version = "0.11", features = ["json", "rustls-tls", "socks"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
