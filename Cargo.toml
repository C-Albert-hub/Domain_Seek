[package]
name = "reverse_dns_tool"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
csv = "1.3"
rust_xlsxwriter = "0.64"
colored = "2.1"
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", features = ["socks", "rustls-tls"] }
futures = "0.3" 
